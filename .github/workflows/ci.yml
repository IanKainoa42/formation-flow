name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'fastlane/metadata/**'
      - '**/screenshots/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'Gemfile'
      - 'Gemfile.lock'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'fastlane/metadata/**'
      - '**/screenshots/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'Gemfile'
      - 'Gemfile.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run tests
        run: |
          xcodebuild test \
            -project FormationFlow.xcodeproj \
            -scheme FormationFlow \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -resultBundlePath TestResults \
            CODE_SIGNING_ALLOWED=NO | xcpretty

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults